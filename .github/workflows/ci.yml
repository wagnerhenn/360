name: CI

on:
  push:
    branches: [main]
  pull_request:

# Política do repositório: merge em `main` exige status verde deste workflow
# + 2 aprovações humanas (Code Reviewer e QA) via branch protection.

jobs:
  quality:
    name: Lint · Tipos · Testes · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: TypeScript (typecheck)
        run: npx tsc --noEmit

      - name: Testes unitários (Vitest)
        run: npx vitest run --reporter=verbose

      - name: Build de produção
        run: npm run build

      - name: Publicar artefato dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 14

  lighthouse:
    name: Lighthouse (performance e acessibilidade)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Auditoria Lighthouse CI
        uses: treosh/lighthouse-ci-action@12.1.0
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
